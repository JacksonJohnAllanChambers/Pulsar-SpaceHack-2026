[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "spacehack-edge-applet"
version = "0.1.0"
description = "Onboard Edge Satellite Applet for Pulsar SpaceHack 2026 - NVIDIA Jetson Orin NX"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.23.0",
    "opencv-python-headless>=4.7.0.72",
    "pillow>=9.5.0",
    "pydantic>=2.4.0",
    "pyyaml>=6.0",
    "psutil>=5.9.0",
    "tifffile>=2023.2.28",
    "onnxruntime>=1.16.0",
    "cryptography>=42.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.black]
line-length = 100
target-version = ['py310']
