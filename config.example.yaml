# Uplinked mission configuration for the onboard applet.
# Radiometric thresholds are reflectance (0..1); sizes are metres and are converted to
# pixels with each scene's GSD, so one file works for 4.75 m and 10 m imagery alike.
# Anything omitted falls back to the defaults in applet/config.py.

mission:
  mission_name: "GALAXIA-CTOS-TACTICAL-DEMO"
  satellite_id: "MOBIUS-1"
  orbital_pass_id: "PASS_2026_09_19_001"
  gsd_meters: 4.75                  # used only when the bundle manifest gives none

screening:
  cloud_cover_max_pct: 60.0         # reject the scene above this cloud fraction
  min_valid_data_pct: 75.0          # reject when too much of the frame is no-data
  min_water_pct: 5.0                # nothing to search if there is no sea
  ndwi_water_min: 0.0               # water: (G-NIR)/(G+NIR) above this ...
  nir_water_max: 0.12               # ... and NIR reflectance below this
  nir_deep_water_max: 0.02          # this dark in NIR is water even where NDWI is undefined (0/0)
  land_min_area_m2: 60000           # non-water blobs bigger than any ship are land
  land_buffer_m: 60                 # keep-out strip for surf, piers, moored clutter
  cloud_brightness_min: 0.22
  cloud_whiteness_max: 0.30         # (max-min)/mean across the four bands
  cloud_min_area_m2: 40000
  cloud_buffer_m: 40

detection:
  cfar_k_sigma: 5.0                 # NIR pixel must exceed local mean by k sigma ...
  cfar_min_contrast: 0.02           # ... and by this much absolute reflectance
  cfar_guard_m: 120
  cfar_background_m: 400
  min_target_area_m2: 90
  max_target_area_m2: 60000
  shore_exclusion_m: 200            # drop blobs this close to land (surf, piers, moored craft)
  clutter_density_per_km2: 3.0      # candidate density that switches on rough-sea logic
  clutter_outlier_mads: 5.0
  wake_search_radius_m: 900
  wake_min_length_m: 60
  wake_min_snr: 3.5
  kelvin_half_angle_deg: 19.47      # arcsin(1/3)
  kelvin_tolerance_deg: 6.0
  min_physics_score: 0.35              # 0.20 measured: +13 alerts, mostly clutter, no extra confirmed ship
  chip_crop_size_px: 64

verifier:
  enabled: true
  model_path: "applet/models/verifier_int8.onnx"
  fallback_model_path: "applet/models/verifier_fp32.onnx"
  reject_below: 0.80                # CNN probability under which a candidate is dropped ...
  physics_override_score: 0.95      # ... unless the physics evidence is this strong
  intra_op_threads: 4

ais_correlation:
  spatial_gating_radius_nm: 1.0
  tight_gate_nm: 0.15
  gate_growth_fraction: 0.25
  max_heading_delta_deg: 35.0
  speed_tolerance_knots: 6.0
  max_fix_age_hours: 3.0            # an AIS fix older than this cannot identify a contact
  speed_can_raise_anomaly: false    # speed disagreement alone is advisory, not an anomaly
  unknown_memory_enabled: false      # remember repeated no-AIS areas between passes (state outlives the pass)
  unknown_memory_radius_nm: 0.08     # nearby detections belong to the same remembered area
  unknown_memory_required_passes: 3  # suppress only after this many distinct acquisition dates
  unknown_memory_max_age_days: 180   # forget an area that stops recurring
  # unknown_memory_path: data/outputs/unknown_contact_memory.json

downlink:
  max_downlink_budget_kb: 500
  include_target_chips: true
  chip_jpeg_quality: 70
  chip_min_priority: 0.5            # known, AIS-consistent traffic does not earn a chip
  write_queues: true                # context crops for the src/pyFlows downlink scheduler
  # queue_dir: src/downlink/queues  # default is <output>/queues; set it to feed a running scheduler
